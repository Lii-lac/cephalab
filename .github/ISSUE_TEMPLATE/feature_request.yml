name: Idea or suggestion
description: Suggest a feature, quality-of-life tweak, or change you'd like to see.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Plain English is great — tell us what would make Cephalab better for you.
      placeholder: Example: A button to sort builds by fewest rolls.
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else? (optional)
      description: Screenshots, rough sketches, or examples from other tools are welcome.
