name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Set up Python companion and s3s
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -q --upgrade pip pyinstaller
          .venv\Scripts\python.exe tools\setup_s3s.py

      - name: Run companion unit tests
        shell: pwsh
        run: .venv\Scripts\python.exe -m unittest tests.companion.test_companion

      - name: Build cephalab.exe
        shell: pwsh
        run: |
          .venv\Scripts\python.exe tools\build_exe.py
          $hash = (Get-FileHash -Algorithm SHA256 dist\cephalab.exe).Hash.ToLower()
          "$hash  cephalab.exe" | Set-Content -Encoding ascii dist\SHA256SUMS.txt

      - name: Self-test cephalab.exe
        timeout-minutes: 3
        shell: pwsh
        run: |
          # a --windowed exe: pwsh wouldn't wait for it or see its exit code without Start-Process -Wait
          $p = Start-Process -FilePath dist\cephalab.exe -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "cephalab.exe --selftest exited $($p.ExitCode)" }

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag dist\cephalab.exe dist\SHA256SUMS.txt --title "Cephalab $tag" --generate-notes --latest
          } else {
            gh release upload $tag dist\cephalab.exe dist\SHA256SUMS.txt --clobber
          }

  build-macos:
    runs-on: macos-latest
    needs: build-windows          # the Windows job creates the release; this one only adds to it
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Set up Python companion and s3s
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -q --upgrade pip pyinstaller
          .venv/bin/python tools/setup_s3s.py

      - name: Run companion unit tests
        run: .venv/bin/python -m unittest tests.companion.test_companion

      - name: Build Cephalab.app
        run: .venv/bin/python tools/build_exe.py

      - name: Sign (ad hoc) and verify
        run: |
          codesign --force --deep -s - dist/Cephalab.app
          codesign --verify --deep --strict dist/Cephalab.app

      - name: Self-test Cephalab.app
        timeout-minutes: 3
        run: dist/Cephalab.app/Contents/MacOS/Cephalab --selftest

      - name: Zip and hash
        run: |
          ditto -c -k --keepParent dist/Cephalab.app dist/Cephalab-macOS-arm64.zip
          cd dist && shasum -a 256 Cephalab-macOS-arm64.zip > SHA256SUMS-macos.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Cephalab-macOS-arm64
          path: |
            dist/Cephalab-macOS-arm64.zip
            dist/SHA256SUMS-macos.txt

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/Cephalab-macOS-arm64.zip dist/SHA256SUMS-macos.txt --clobber
